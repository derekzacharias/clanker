name: Security

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
  schedule:
    # Weekly, so a new advisory against unchanged code is still noticed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Static analysis (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # G104 (unhandled errors on Close/Write) is noise for this codebase; everything
          # else fails the build, including file permissions and weak crypto.
          gosec -exclude=G104 -severity=medium -confidence=medium ./internal/vuln/...

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build the UI
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --maxWorkers=2
      - name: Dependency audit
        # High and critical only: a moderate advisory in a build-time dependency should not
        # block a security fix, but it is still reported in the run log.
        run: npm audit --audit-level=high

  image:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the same image the deploy script builds
        # The production image is FROM scratch with one static binary, generated by
        # scripts/deploy-docker4.sh; there is no committed Dockerfile to build. Recreate
        # it here so the scan covers what actually ships.
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/ctx/clanker .
          cp -r web/dist /tmp/ctx/web
          cp /etc/ssl/certs/ca-certificates.crt /tmp/ctx/
          printf '%s\n' \
            'FROM scratch' \
            'COPY ca-certificates.crt /etc/ssl/certs/ca-certificates.crt' \
            'COPY clanker /usr/local/bin/clanker' \
            'COPY web /web' \
            'EXPOSE 8787' \
            'ENTRYPOINT ["/usr/local/bin/clanker", "vuln", "serve"]' > /tmp/ctx/Dockerfile
          docker build -t clanker-guard:ci /tmp/ctx
      - name: Trivy scan (reports and fails on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clanker-guard:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
